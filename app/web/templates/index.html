{% extends "base.html" %}
{% block title %}Submit a request · Feature Triage{% endblock %}
{% block content %}
<h1>Submit a feature request</h1>
<p class="muted">The AI checks for duplicates and suggests a category. Nothing is saved to a feature until a reviewer approves it.</p>
<form class="panel" method="post" action="/submissions">
  <label for="title">Title</label>
  <input type="text" id="title" name="title" maxlength="200" required autofocus>
  <label for="description">Description</label>
  <textarea id="description" name="description" rows="6" required></textarea>
  <div class="actions"><button class="primary" type="submit">Submit</button></div>
</form>
{% endblock %}
