<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Feature Triage{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #656d76;
      --border: #d8dadd; --accent: #2f6feb; --accent-text: #ffffff;
      --ok: #1a7f37; --warn: #9a6700; --danger: #cf222e; --soft: #eef2f7;
      --add: #dafbe1; --del: #ffebe9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --panel: #171a21; --text: #e6e8eb; --muted: #9aa3ad;
        --border: #2d333b; --accent: #4c8dff; --accent-text: #0f1115;
        --ok: #3fb950; --warn: #d29922; --danger: #f85149; --soft: #1f242d;
        --add: #12361f; --del: #3d1618;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { background: var(--panel); border-bottom: 1px solid var(--border); }
    nav { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    nav .brand { font-weight: 600; margin-right: auto; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin: 16px 0; }
    .panel.flag { border-left: 4px solid var(--warn); }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
    .box { background: var(--soft); border-radius: 6px; padding: 12px; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.warn { color: var(--warn); border-color: var(--warn); }
    .error { background: var(--del); border: 1px solid var(--danger); color: var(--text); padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
    label { display: block; font-weight: 500; margin: 12px 0 4px; }
    input[type=text], textarea, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
           background: var(--panel); color: var(--text); font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button.danger { color: var(--danger); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 13px; color: var(--muted); font-weight: 500; }
    .diff div { padding: 4px 8px; border-radius: 4px; margin: 2px 0; }
    .diff .del { background: var(--del); }
    .diff .add { background: var(--add); }
    .notice { background: var(--add); border: 1px solid var(--ok); color: var(--text); padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
    .banner { background: var(--soft); border: 1px solid var(--warn); padding: 10px 14px; border-radius: 6px; margin: 12px 0;
              display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .toolbar form { margin: 0; }
    .toolbar button { padding: 4px 10px; font-size: 13px; }
    .toolbar button[aria-expanded="true"] { background: var(--soft); border-color: var(--accent); }
    .tool-panel { background: var(--soft); border-radius: 6px; padding: 12px 16px; margin-top: 12px; }
    .tool-panel[hidden] { display: none; }
    .submission.archived { opacity: 0.6; }
    .submission { border-top: 1px solid var(--border); padding: 12px 0; }
    .submission:first-child { border-top: none; }
    .meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="brand">Feature Triage</span>
      <a href="/">Submit</a>
      <a href="/review">Review queue</a>
      <a href="/features">Features</a>
      <a href="/categories">Categories</a>
    </nav>
  </header>
  <main>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    {% if notice %}<div class="notice" role="status">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Toolbar buttons with data-panel="<id>" show or hide that panel.
    // Opening one panel closes the other panels in the same toolbar group.
    document.addEventListener("click", function (event) {
      const button = event.target.closest("[data-panel]");
      if (!button) return;
      const panel = document.getElementById(button.dataset.panel);
      const opening = panel.hidden;
      const group = button.closest("[data-toolbar-group]");
      if (group) {
        group.querySelectorAll("[data-panel]").forEach(function (other) {
          document.getElementById(other.dataset.panel).hidden = true;
          other.setAttribute("aria-expanded", "false");
        });
      }
      panel.hidden = !opening;
      button.setAttribute("aria-expanded", String(opening));
      if (opening) {
        const firstField = panel.querySelector("input, select, textarea");
        if (firstField) firstField.focus();
      }
    });
  </script>
</body>
</html>
